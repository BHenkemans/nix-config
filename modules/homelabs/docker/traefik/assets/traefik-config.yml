http:
  routers:
    pihole:
      entryPoints:
        - "https"
      rule: "Host(`ns.bartjan.tech`)"
      middlewares:
        - secured
      tls: {}
      service: pihole
    proxmox:
      entryPoints:
        - "https"
      rule: "Host(`pve.bartjan.tech`)"
      middlewares:
        - secured
      tls: {}
      service: proxmox
    ha:
      entryPoints:
        - "https"
      rule: "Host(`ha.bartjan.tech`)"
      middlewares:
        - secured
      tls: {}
      service: ha
    router:
      entryPoints:
        - "https"
      rule: "Host(`router.bartjan.tech`)"
      middlewares:
        - secured
      tls: {}
      service: router

  services:
    ha:
      loadBalancer:
        servers:
          - url: "http://192.168.1.11:8123"
        passHostHeader: true
    proxmox:
      loadBalancer:
        servers:
          - url: "https://192.168.1.40:8006"
        passHostHeader: true
    pihole:
      loadBalancer:
        servers:
          - url: "http://192.168.1.31/admin"
        passHostHeader: true
    router:
      loadBalancer:
        servers:
          - url: "http://192.168.0.1"
        passHostHeader: true

  middlewares:
    https-redirectscheme:
      redirectScheme:
        scheme: https
        permanent: true
    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https
    default-whitelist:
      ipAllowList:
        sourceRange:
          - "10.0.0.0/8"
          - "192.168.0.0/16"
          - "172.16.0.0/12"
    secured:
      chain:
        middlewares:
          - default-whitelist
          - default-headers
